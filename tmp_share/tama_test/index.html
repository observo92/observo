<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tama Station - Movement Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0d0d0d;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  .game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 900px;
    height: 448px;
    max-width: 95vw;
    max-height: 90vh;
  }
  #stage img.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    image-rendering: pixelated;
  }
  #tama {
    position: absolute;
    height: 55px;
    image-rendering: pixelated;
    transform: translate(-50%, -85%);
    pointer-events: none;
  }
  .hint {
    position: absolute;
    top: 12px;
    left: 12px;
    color: #666;
    font-size: 12px;
  }
  /* rotate device prompt */
  #rotate-warning {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    color: #ffdd55;
    z-index: 999;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 18px;
    padding: 20px;
  }
  @media (max-width: 900px) and (orientation: portrait) {
    #rotate-warning { display: flex; }
    .game-wrap { display: none; }
  }
</style>
</head>
<body>

<div id="rotate-warning">
  🔄 Please rotate your device<br>to landscape mode
</div>

<div class="game-wrap">
  <div id="stage">
    <img class="bg" src="scene.png">
    <img id="tama" src="tama_down.png">
    <div class="hint">WASD / Arrow keys to move &middot; tap-to-move on mobile</div>
  </div>
</div>

<script>
  const tama = document.getElementById('tama');
  const stage = document.getElementById('stage');

  let x = 450, y = 300; // starting position (px, relative to stage)
  let facing = 'down';
  const speed = 4;
  const keys = {};

  const sprites = {
    down: 'tama_down.png',
    up: 'tama_up.png',
    left: 'tama_left.png',
    right: 'tama_right.png',
  };

  function updateSprite(dir) {
    if (dir !== facing) {
      facing = dir;
      tama.src = sprites[facing];
    }
  }

  function render() {
    tama.style.left = x + 'px';
    tama.style.top = y + 'px';
  }
  render();

  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // tap-to-move target
  let target = null;
  stage.addEventListener('click', e => {
    const rect = stage.getBoundingClientRect();
    target = {
      x: (e.clientX - rect.left) / rect.width * stage.offsetWidth,
      y: (e.clientY - rect.top) / rect.height * stage.offsetHeight,
    };
  });

  function gameLoop() {
    let dx = 0, dy = 0;

    if (keys['arrowup'] || keys['w']) dy -= 1;
    if (keys['arrowdown'] || keys['s']) dy += 1;
    if (keys['arrowleft'] || keys['a']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;

    if (dx !== 0 || dy !== 0) {
      target = null; // keyboard overrides tap target
      const len = Math.sqrt(dx*dx + dy*dy);
      dx = dx / len * speed;
      dy = dy / len * speed;
    } else if (target) {
      const tdx = target.x - x;
      const tdy = target.y - y;
      const dist = Math.sqrt(tdx*tdx + tdy*tdy);
      if (dist > speed) {
        dx = tdx / dist * speed;
        dy = tdy / dist * speed;
      } else {
        dx = tdx; dy = tdy;
        target = null;
      }
    }

    if (dx !== 0 || dy !== 0) {
      x += dx;
      y += dy;
      x = Math.max(20, Math.min(stage.offsetWidth - 20, x));
      y = Math.max(20, Math.min(stage.offsetHeight - 20, y));

      if (Math.abs(dx) > Math.abs(dy)) {
        updateSprite(dx > 0 ? 'right' : 'left');
      } else {
        updateSprite(dy > 0 ? 'down' : 'up');
      }
      render();
    }

    requestAnimationFrame(gameLoop);
  }
  gameLoop();
</script>

</body>
</html>
